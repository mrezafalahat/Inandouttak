name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Create Android files
        run: flutter create --platforms=android --project-name manabe_masaref .

      - name: Patch Android and Kotlin
        run: |
          sed -i 's/version "1.7.10"/version "1.9.24"/g' android/settings.gradle || true
          sed -i "s/version '1.7.10'/version '1.9.24'/g" android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle || true

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle || true

          echo "android.aapt2FromMavenOverride=\$ANDROID_HOME/build-tools/35.0.0/aapt2" >> android/gradle.properties

          echo "===== SETTINGS.GRADLE ====="
          cat android/settings.gradle

          echo "===== APP BUILD.GRADLE ====="
          cat android/app/build.gradle

      - name: Verify Kotlin Version
        run: |
          echo "===== KOTLIN ====="
          grep -R "org.jetbrains.kotlin.android" android || true
          grep -R "1.9.24" android || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tak-cashflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
